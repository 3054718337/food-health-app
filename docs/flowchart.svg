<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="840" viewBox="0 0 1140 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a8f7c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#187a52"/>
    </marker>
  </defs>

  <rect width="1140" height="840" fill="#f6f1e6"/>

  <text x="40" y="42" font-size="23" font-weight="700" fill="#1c2a24">食刻 · 饮食健康评估流程</text>
  <text x="40" y="67" font-size="13" fill="#6e7c74">从菜品录入，到六维评分，再到明天的三餐建议</text>

  <!-- 左：用户侧 -->
  <rect x="40" y="92" width="460" height="584" rx="18" fill="#fffdf8" stroke="#e6ddca"/>
  <text x="68" y="126" font-size="14" font-weight="700" fill="#0f5132">① 用户输入</text>
  <text x="150" y="126" font-size="11.5" fill="#6e7c74">录入当天吃了什么</text>

  <g font-size="14.5">
    <rect x="72" y="156" width="396" height="58" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="72" y="156" width="4" height="58" rx="2" fill="#187a52"/>
    <text x="96" y="180" font-weight="600" fill="#1c2a24">打开「食刻」首页</text>
    <text x="96" y="199" font-size="11.5" fill="#6e7c74">空状态说明能做什么，右侧给出示例入口</text>

    <rect x="72" y="238" width="396" height="58" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="72" y="238" width="4" height="58" rx="2" fill="#187a52"/>
    <text x="96" y="262" font-weight="600" fill="#1c2a24">选择记录范围</text>
    <text x="96" y="281" font-size="11.5" fill="#6e7c74">全天记录 ／ 只记一餐（参考量按 0.4 折算）</text>

    <rect x="72" y="320" width="396" height="58" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="72" y="320" width="4" height="58" rx="2" fill="#187a52"/>
    <text x="96" y="344" font-weight="600" fill="#1c2a24">选择菜品</text>
    <text x="96" y="363" font-size="11.5" fill="#6e7c74">搜索、按 7 类浏览（主食/荤/素/汤/水果/奶豆/零食）</text>

    <rect x="72" y="402" width="396" height="58" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="72" y="402" width="4" height="58" rx="2" fill="#187a52"/>
    <text x="96" y="426" font-weight="600" fill="#1c2a24">调整份量</text>
    <text x="96" y="445" font-size="11.5" fill="#6e7c74">每份 0.5–5 份，实时换算克数与热量</text>

    <rect x="72" y="484" width="396" height="58" rx="12" fill="#0f5132" stroke="#0f5132"/>
    <text x="96" y="508" font-weight="600" fill="#ffffff">点击「生成健康评估」</text>
    <text x="96" y="527" font-size="11.5" fill="#bfe3cd">至少添加 1 份，按钮才可点击</text>

    <rect x="72" y="566" width="396" height="58" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="72" y="566" width="4" height="58" rx="2" fill="#c98519"/>
    <text x="96" y="590" font-weight="600" fill="#1c2a24">查看报告并微调</text>
    <text x="96" y="609" font-size="11.5" fill="#6e7c74">改份量即时重算，可清空重新记录</text>
  </g>

  <g stroke="#9a8f7c" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M270 214 V238"/>
    <path d="M270 296 V320"/>
    <path d="M270 378 V402"/>
    <path d="M270 460 V484"/>
    <path d="M270 542 V566"/>
  </g>

  <text x="72" y="650" font-size="11" fill="#8b978f">所有数据仅保存在本机浏览器，不上传服务器</text>

  <!-- 主连接：用户 → 引擎 -->
  <path d="M468 513 H510 V182 H572" stroke="#187a52" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
  <text x="528" y="352" font-size="11" fill="#187a52" transform="rotate(90 528 352)">触发评估</text>

  <!-- 右：系统侧 -->
  <rect x="540" y="92" width="560" height="676" rx="18" fill="#fffdf8" stroke="#e6ddca"/>
  <text x="568" y="126" font-size="14" font-weight="700" fill="#0f5132">② 评估引擎</text>
  <text x="650" y="126" font-size="11.5" fill="#6e7c74">纯前端计算，无后端依赖</text>

  <g font-size="14.5">
    <rect x="572" y="156" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="156" width="4" height="52" rx="2" fill="#187a52"/>
    <text x="596" y="179" font-weight="600" fill="#1c2a24">营养换算</text>
    <text x="596" y="196" font-size="11.5" fill="#6e7c74">份量 × 每 100g 营养值，逐项累加</text>

    <rect x="572" y="228" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="228" width="4" height="52" rx="2" fill="#187a52"/>
    <text x="596" y="251" font-weight="600" fill="#1c2a24">汇总 12 项摄入指标</text>
    <text x="596" y="268" font-size="11.5" fill="#6e7c74">热量、蛋白质、脂肪、碳水、钠、纤维、蔬果、全谷、糖、奶类</text>

    <rect x="572" y="300" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="300" width="4" height="52" rx="2" fill="#187a52"/>
    <text x="596" y="323" font-weight="600" fill="#1c2a24">六维评分（权重合计 100）</text>
    <text x="596" y="340" font-size="11.5" fill="#6e7c74">蔬果 25 ｜ 蛋白质 20 ｜ 主食 20 ｜ 油盐糖 20 ｜ 能量 10 ｜ 多样性 5</text>

    <rect x="572" y="372" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="372" width="4" height="52" rx="2" fill="#c98519"/>
    <text x="596" y="395" font-weight="600" fill="#1c2a24">综合得分与等级</text>
    <text x="596" y="412" font-size="11.5" fill="#6e7c74">0–100 分 → A 优秀 / B 良好 / C 需改进 / D 偏差较大</text>

    <rect x="572" y="444" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="444" width="4" height="52" rx="2" fill="#c98519"/>
    <text x="596" y="467" font-weight="600" fill="#1c2a24">识别短板指标</text>
    <text x="596" y="484" font-size="11.5" fill="#6e7c74">超过上限或低于目标的指标 → 预警标签（钠、糖、蔬果、全谷…）</text>

    <rect x="572" y="516" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="516" width="4" height="52" rx="2" fill="#187a52"/>
    <text x="596" y="539" font-weight="600" fill="#1c2a24">生成改进建议</text>
    <text x="596" y="556" font-size="11.5" fill="#6e7c74">按缺口比例排序取前 5 条；无短板则输出「保持现状」</text>

    <rect x="572" y="588" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="588" width="4" height="52" rx="2" fill="#187a52"/>
    <text x="596" y="611" font-weight="600" fill="#1c2a24">生成明日三餐搭配</text>
    <text x="596" y="628" font-size="11.5" fill="#6e7c74">按缺口拼接早餐 / 午餐 / 晚餐 / 加餐，给出具体克数</text>

    <rect x="572" y="660" width="496" height="52" rx="12" fill="#ffffff" stroke="#ddd3bf"/>
    <rect x="572" y="660" width="4" height="52" rx="2" fill="#c98519"/>
    <text x="596" y="683" font-weight="600" fill="#1c2a24">渲染报告并保存</text>
    <text x="596" y="700" font-size="11.5" fill="#6e7c74">总分环 + 六维条形 + 指标卡 + 建议 + 三餐；写入 localStorage</text>
  </g>

  <g stroke="#9a8f7c" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M820 208 V228"/>
    <path d="M820 280 V300"/>
    <path d="M820 352 V372"/>
    <path d="M820 424 V444"/>
    <path d="M820 496 V516"/>
    <path d="M820 568 V588"/>
    <path d="M820 640 V660"/>
  </g>

  <!-- 回环：报告 → 调整 -->
  <path d="M572 686 H510 V595 H468" stroke="#c98519" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="528" y="646" font-size="11" fill="#a06c12" transform="rotate(90 528 646)">调整后重算</text>

  <!-- 图例 -->
  <g font-size="11.5" fill="#6e7c74">
    <rect x="40" y="792" width="22" height="14" rx="4" fill="#ffffff" stroke="#ddd3bf"/>
    <text x="70" y="803">处理步骤</text>
    <rect x="150" y="792" width="22" height="14" rx="4" fill="#0f5132"/>
    <text x="180" y="803">关键动作</text>
    <line x1="262" y1="799" x2="300" y2="799" stroke="#9a8f7c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="308" y="803">顺序流向</text>
    <line x1="386" y1="799" x2="424" y2="799" stroke="#187a52" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
    <text x="432" y="803">跨模块触发</text>
    <text x="540" y="803">两栏分别为「用户操作」与「系统计算」；评分全部在浏览器本地完成</text>
  </g>
</svg>
